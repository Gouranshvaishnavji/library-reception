services:
  db:
    image: postgres:15
    container_name: library_db
    environment:
      POSTGRES_USER: gouransh
      POSTGRES_PASSWORD: Gouransh@29
      POSTGRES_DB: library
    ports:
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  pgdata: